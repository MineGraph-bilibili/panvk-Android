[constants]
ndk_home = '$ANDROID_NDK_HOME'
working_dir = '$MESON_WORKING_DIR'
ndk_bin = ndk_home / 'toolchains/llvm/prebuilt/linux-x86_64/bin'
ndk_sysroot = ndk_home / 'toolchains/llvm/prebuilt/linux-x86_64/sysroot'

[binaries]
c = [ndk_bin / 'aarch64-linux-android30-clang', '-D__TERMUX__']
cpp = [ndk_bin / 'aarch64-linux-android30-clang++',
        '-fno-exceptions',
        '--start-no-unused-arguments',
        # '-static-libstdc++', # gralloc 4/5 needs to use std::__1::string/vector from libc++
        '--end-no-unused-arguments',
        '-D__TERMUX__']
ar = ndk_bin / 'llvm-ar'
strip = ndk_bin / 'llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
sys_root = ndk_sysroot
needs_exe_wrapper = true
pkg_config_libdir = working_dir / 'shims'

[built-in options]
c_args = ['--sysroot=' + ndk_sysroot, '-fno-emulated-tls',
        '-I' + working_dir / 'shims/include', '-isystem' + ndk_sysroot / 'usr/include',
        '-DHAVE_STRUCT_TIMESPEC', '-DHAVE_DLFCN_H', '-UHAVE_SECURE_GETENV', '-UHAVE_QSORT_S',
        '-include', 'fcntl.h', '-include', 'time.h', '-Wl,-llog', '-Wl,-lsync', '-fvisibility=default']
cpp_args = ['--sysroot=' + ndk_sysroot,
            '-include', working_dir / 'src/util/u_gralloc/force_aosp_abi.h',
            '-D_LIBCPP_DISABLE_EXTERN_TEMPLATE',
            '-fno-emulated-tls', '-I' + working_dir / 'shims/include',
            '-isystem' + ndk_sysroot / 'usr/include',
            '-DHAVE_STRUCT_TIMESPEC', '-DHAVE_DLFCN_H', '-UHAVE_SECURE_GETENV', '-UHAVE_QSORT_S',
            '-include', 'fcntl.h', '-include', 'time.h', '-include', 'dlfcn.h', '-Wl,-llog', '-Wl,-lsync', '-fvisibility=default',
            '-D_LIBCPP_ABI_NAMESPACE=__1']
c_link_args = ['--sysroot=' + ndk_sysroot, '-Wl,--allow-shlib-undefined',
                '-L' + working_dir / 'shims',
                '-L' + ndk_home / 'toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux/aarch64',
                '-llog', '-lsync']
cpp_link_args = ['--sysroot=' + ndk_sysroot, '-Wl,--allow-shlib-undefined',
                '-L' + working_dir / 'shims',
                '-L' + ndk_home / 'toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux/aarch64',
                '-llog', '-lsync']
