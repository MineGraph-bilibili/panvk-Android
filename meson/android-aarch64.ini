# Meson cross file: ARM64 Android Bionic (built via NDK clang)
# Usage: meson setup build/android-bionic --cross-file meson/android-aarch64.ini
# NDK path: pass -Dndk=/opt/android-sdk/ndk/<ver> or set ANDROID_NDK_ROOT.
[binaries]
c = 'aarch64-linux-android35-clang'
cpp = 'aarch64-linux-android35-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
c_args = []
c_link_args = []
# never mix glibc host tools into the Bionic target: build host tools
# separately (scripts/bootstrap-host-tools.sh) and pass
# -Dnative-file with tool paths via meson build --native-file
