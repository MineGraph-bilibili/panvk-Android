# Meson native file: ARM64 glibc (NativeCode PRoot / Bachata runtime)
# Usage: meson setup build/linux-glibc --native-file meson/linux-aarch64-native.ini
[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
c_args = []
c_link_args = []
